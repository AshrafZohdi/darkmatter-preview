<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Collection | DarkMatter</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#F2F0F7}a:hover{color:#C8B8FF}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #8B6CFF;outline-offset:3px}
input,textarea,select,button{font:inherit}
@property --dm-a{syntax:'<angle>';initial-value:0deg;inherits:false}
.dm-btn{position:relative;isolation:isolate;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease,background-color .3s ease,color .3s ease}
.dm-btn::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--dm-a),transparent 0deg,transparent 220deg,rgba(139,108,255,.9) 290deg,#E9E2FF 330deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s ease;pointer-events:none;z-index:1}
.dm-btn:hover::before,.dm-btn:focus-visible::before{opacity:1;animation:dmOrbitLine 1.8s linear infinite}
@keyframes dmOrbitLine{to{--dm-a:360deg}}
.dm-btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px -14px rgba(139,108,255,.85),0 0 0 1px rgba(139,108,255,.25)}
.dm-btn:active{transform:translateY(0) scale(.98)}
.dm-fill:hover{background-color:#FFFFFF !important;color:#000 !important}
.dm-line:hover{background-color:rgba(139,108,255,.14) !important}
.dm-roll{display:inline-block;position:relative;overflow:hidden;vertical-align:middle;line-height:1.3}
.dm-roll>span{display:inline-block;position:relative;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.dm-roll>span::after{content:attr(data-t);position:absolute;left:0;top:100%;white-space:nowrap}
.dm-btn:hover .dm-roll>span,.dm-btn:focus-visible .dm-roll>span{transform:translateY(-100%)}
.dm-ico{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:#F2F0F7;cursor:pointer;transition:background-color .25s ease,box-shadow .25s ease,color .25s ease}
.dm-ico:hover{background-color:#16131D;box-shadow:0 0 22px rgba(139,108,255,.45);color:#C8B8FF}
.dm-nav a{background:linear-gradient(#C8B8FF,#C8B8FF) 0 100%/0 1px no-repeat;transition:background-size .35s cubic-bezier(.2,.8,.2,1),color .25s ease}
.dm-nav a:hover{background-size:100% 1px}
.dm-mob{display:none !important}
.dm-menu{animation:dmMenuFade .35s ease both}
@keyframes dmMenuFade{from{opacity:0}to{opacity:1}}
.dm-mi{opacity:0;animation:dmMenuIn .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes dmMenuIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (max-width: 820px){.dm-desk{display:none !important}.dm-mob{display:inline-flex !important}}
@media (prefers-reduced-motion: reduce){.dm-btn,.dm-roll>span{transition:none}.dm-btn:hover::before{animation:none}.dm-menu,.dm-mi{animation:none;opacity:1}}
.dm-pgrid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.dm-card{transition:border-color .3s ease,box-shadow .3s ease,transform .4s cubic-bezier(.2,.8,.2,1)}
.dm-card:hover{border-color:#8B6CFF !important;box-shadow:0 0 0 1px #8B6CFF,0 0 48px rgba(139,108,255,.3);transform:translateY(-4px)}
.dm-img{transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.dm-card:hover .dm-img{transform:scale(1.04)}
.dm-img2{opacity:0;transition:opacity .5s ease,transform .7s cubic-bezier(.2,.8,.2,1);transform:scale(1.04)}
.dm-card:hover .dm-img2{opacity:1;transform:scale(1)}
.dm-qv{opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease}
.dm-card:hover .dm-qv,.dm-card:focus-within .dm-qv{opacity:1;transform:none}
.dm-in{animation:dmIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes dmIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.dm-overlay{animation:dmMenuFade .25s ease both}
.dm-pop{animation:dmPop .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes dmPop{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.dm-drawer{animation:dmDrawer .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes dmDrawer{from{transform:translateX(100%)}to{transform:none}}
[dir=rtl] .dm-drawer{animation-name:dmDrawerR}
@keyframes dmDrawerR{from{transform:translateX(-100%)}to{transform:none}}
.dm-tabs{flex-wrap:wrap}
@media (max-width: 640px){.dm-pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px !important}.dm-tabs{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px}.dm-tabs button{flex:none}.dm-qv{display:none !important}.dm-sortrow{width:100%}.dm-search{flex:1 1 100%}.dm-search input{width:100% !important}}
@media (prefers-reduced-motion: reduce){.dm-in,.dm-pop,.dm-drawer,.dm-overlay{animation:none}}

</style>

</head>
<body>
<div id="app"></div>
<template id="dm-template">
<div dir="{{dir}}" lang="{{lang}}" style="background: #000000; color: #F2F0F7; font-family: 'IBM Plex Sans Arabic', sans-serif; min-height: 100%; overflow-x: clip">
<header style="position: relative; z-index: 20">
<div style="max-width: 1280px; margin: 0 auto; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: center; gap: 44px">
<a href="index.html" aria-label="DarkMatter home" style="font-family: Michroma, IBM Plex Sans Arabic, sans-serif; font-size: 17px; letter-spacing: 0.12em; line-height: 1.05; text-decoration: none; color: #F2F0F7" dir="ltr">DARK<br>MATTER</a>
<nav aria-label="Main" class="dm-nav dm-desk" style="display: flex; gap: 30px; font-size: 15px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="3"><a href="{{n.href}}" aria-current="{{n.cur}}" style="{{n.style}}">{{n.label}}</a></sc-for>
</nav>
</div>
<div style="display: flex; align-items: center; gap: 2px">
<button type="button" class="dm-desk dm-ico" onClick="{{toggleLang}}" style="width: auto; padding: 0 14px; font-size: 15px">{{langLabel}}</button>
<button type="button" class="dm-ico" aria-label="Search" onClick="{{focusSearch}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg></button>
<button type="button" class="dm-ico" aria-label="Cart, {{cartCount}} items" onClick="{{openCart}}" style="position: relative"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 7h14l-1.5 12h-11z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><sc-if value="{{hasCart}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #8B6CFF; color: #000; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">{{cartCount}}</span></sc-if></button>
<button type="button" class="dm-mob dm-ico" onClick="{{openMenu}}" aria-label="Open menu" aria-expanded="{{menuAria}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h10"/></svg></button>
</div>
</div>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div class="dm-menu" role="dialog" aria-modal="true" aria-label="Menu" style="position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.97); backdrop-filter: blur(14px); display: flex; flex-direction: column; padding: 18px 24px 32px; box-sizing: border-box; overflow-y: auto">
<div aria-hidden="true" style="position: absolute; right: -200px; top: 30%; width: 600px; height: 600px; background: radial-gradient(closest-side, rgba(107,79,216,0.35), transparent); pointer-events: none"></div>
<div style="position: relative; display: flex; justify-content: space-between; align-items: center">
<a href="index.html" style="font-family: Michroma, IBM Plex Sans Arabic, sans-serif; font-size: 17px; letter-spacing: 0.12em; line-height: 1.05; text-decoration: none" dir="ltr">DARK<br>MATTER</a>
<button type="button" class="dm-ico" onClick="{{closeMenu}}" aria-label="Close menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
</div>
<nav aria-label="Mobile" style="position: relative; display: flex; flex-direction: column; gap: 6px; margin: 56px 0 auto">
<sc-for list="{{mnav}}" as="n" hint-placeholder-count="4"><a href="{{n.href}}" class="dm-mi" onClick="{{closeMenu}}" style="{{n.mStyle}}">{{n.label}}</a></sc-for>
</nav>
<div class="dm-mi" style="animation-delay: .45s; position: relative; display: flex; flex-direction: column; gap: 18px; margin-top: 48px">
<a href="https://wa.me/97460085588" target="_blank" rel="noopener" class="dm-btn dm-fill" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 0 26px; background: #F2F0F7; color: #000; border-radius: 27px; text-decoration: none; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/></svg><span class="dm-roll"><span data-t="WhatsApp +974 6008 5588">WhatsApp +974 6008 5588</span></span></a>
<button type="button" onClick="{{toggleLang}}" class="dm-btn dm-line" style="min-height: 50px; border: 1px solid #3A3546; border-radius: 25px; background: transparent; color: #F2F0F7; cursor: pointer"><span class="dm-roll"><span data-t="{{langLabel}}">{{langLabel}}</span></span></button>
<div style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; font-size: 15px"><a href="https://www.instagram.com/darkmatter.qa" target="_blank" rel="noopener" style="text-decoration: none; color: #A9A3B8">Instagram</a><a href="https://www.tiktok.com/@darkmatter.qa" target="_blank" rel="noopener" style="text-decoration: none; color: #A9A3B8">TikTok</a><a href="https://www.snapchat.com/add/darkmatter.qa" target="_blank" rel="noopener" style="text-decoration: none; color: #A9A3B8">Snapchat</a><a href="https://m.facebook.com/61579856102959/" target="_blank" rel="noopener" style="text-decoration: none; color: #A9A3B8">Facebook</a></div>
</div>
</div>
</sc-if>
</header>
<section style="position: relative; overflow: hidden; margin-top: -86px; padding-top: 86px">
<div aria-hidden="true" style="position: absolute; left: 50%; top: -120px; width: 1100px; height: 520px; margin-left: -550px; background: radial-gradient(closest-side, rgba(107,79,216,0.30), transparent); pointer-events: none"></div>
<div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 48px 24px 36px">
<h1 style="font-family: Michroma, IBM Plex Sans Arabic, sans-serif; font-weight: 400; font-size: clamp(32px, 5vw, 64px); line-height: 1.08; margin: 0 0 14px">{{heroTitle}}</h1>
<p style="color: #C9C3D6; font-size: 18px; line-height: 1.6; margin: 0; max-width: 620px">{{heroText}}</p>
</div>
</section>

<div style="position: sticky; top: 0; z-index: 10; background: rgba(0,0,0,0.86); backdrop-filter: blur(10px); border-top: 1px solid #16131D; border-bottom: 1px solid #16131D">
<div style="max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 12px 20px; justify-content: space-between; align-items: center">
<div role="tablist" aria-label="Collections" class="dm-tabs" style="display: flex; gap: 6px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button type="button" role="tab" class="dm-btn dm-line" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}} <span style="opacity: 0.6; margin-inline-start: 4px">{{t.count}}</span></button>
</sc-for>
</div>
<div class="dm-sortrow" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<label class="dm-search" style="display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 14px; border: 1px solid #2E2A38; border-radius: 21px; background: #0A0910"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search pieces</span><input ref="{{searchRef}}" value="{{q}}" onInput="{{setQ}}" placeholder="{{searchPh}}" style="width: 150px; background: transparent; border: 0; color: #F2F0F7; outline: none"></label>
<sc-for list="{{sorts}}" as="o" hint-placeholder-count="3">
<button type="button" aria-pressed="{{o.selected}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
</sc-for>
</div>
</div>
</div>

<section aria-label="Products" style="max-width: 1280px; margin: 0 auto; padding: 36px 24px 96px">
<div aria-live="polite" style="color: #8A8499; font-size: 14px; margin-bottom: 20px">{{countText}}</div>

<sc-if value="{{showSet}}" hint-placeholder-val="{{ false }}">
<button type="button" class="dm-card" onClick="{{openSet}}" style="width: 100%; display: flex; flex-wrap: wrap; gap: 28px; align-items: center; text-align: start; color: #F2F0F7; cursor: pointer; padding: 14px; margin-bottom: 26px; border: 1px solid #1C1925; border-radius: 16px; background: linear-gradient(120deg, #120F1C, #050408 70%)">
<div style="flex: 1 1 380px; min-width: 0; aspect-ratio: 16 / 8; border-radius: 10px; overflow: hidden; background: #E8E6E3"><img class="dm-img" src="assets/26.jpg" alt="All eight Qatar 2022 stadium models framed on a wall" style="width: 100%; height: 100%; object-fit: cover; object-position: center 40%"></div>
<div style="flex: 1 1 280px; min-width: 0; padding: 8px 10px">
<div style="color: #B9A6FF; font-size: 14px; margin-bottom: 10px">{{t.setLabel}}</div>
<div style="font-family: Michroma, IBM Plex Sans Arabic, sans-serif; font-size: clamp(20px, 2.4vw, 24px); line-height: 1.3; margin-bottom: 10px">{{t.setTitle}}</div>
<p style="color: #C9C3D6; line-height: 1.6; margin: 0 0 18px">{{t.setText}}</p>
<span class="dm-btn dm-line" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 24px; border: 1px solid #F2F0F7; border-radius: 23px"><span class="dm-roll"><span data-t="{{t.quick}}">{{t.quick}}</span></span></span>
</div>
</button>
</sc-if>

<div class="dm-pgrid" style="display: grid; gap: 22px">
<sc-for list="{{items}}" as="p" hint-placeholder-count="12">
<article class="dm-card dm-in" style="{{p.cardStyle}}">
<button type="button" onClick="{{p.open}}" aria-label="Quick view {{p.name}}" style="display: block; width: 100%; padding: 0; border: 0; background: transparent; color: #F2F0F7; text-align: start; cursor: pointer">
<div style="aspect-ratio: 4 / 5; border-radius: 10px; overflow: hidden; position: relative; background: #08070C">
<img class="dm-img" src="{{p.img}}" alt="{{p.name}}" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<img class="dm-img2" src="{{p.img2}}" alt="" aria-hidden="true" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<sc-if value="{{p.tag}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 10px; inset-inline-start: 10px; padding: 4px 10px; border-radius: 12px; background: rgba(0,0,0,0.72); border: 1px solid #3A3546; font-size: 12px">{{p.tag}}</span></sc-if>
<span class="dm-qv" style="position: absolute; left: 10px; right: 10px; bottom: 10px; min-height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 20px; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); border: 1px solid #3A3546; font-size: 14px">{{t.quick}}</span>
</div>
<div style="padding: 14px 4px 2px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px">{{p.name}}</span>
<sc-if value="{{p.ar}}" hint-placeholder-val="{{ false }}"><span lang="ar" style="color: #A9A3B8; font-size: 15px">{{p.ar}}</span></sc-if>
<span style="color: #C9C3D6; margin-top: 2px" dir="ltr">QAR {{p.price}}</span>
</div>
</button>
<button type="button" class="dm-btn {{p.addCls}}" onClick="{{p.add}}" style="{{p.addStyle}}"><span class="dm-roll"><span data-t="{{p.addLabel}}">{{p.addLabel}}</span></span></button>
</article>
</sc-for>
</div>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 48px 0; color: #C9C3D6">{{t.empty}} <button type="button" onClick="{{clearQ}}" style="background: none; border: 0; color: #C8B8FF; text-decoration: underline; cursor: pointer; min-height: 44px">{{t.clear}}</button></div>
</sc-if>

<div style="margin-top: 72px; padding: clamp(24px, 4vw, 40px); border: 1px solid #221E2C; border-radius: 18px; display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: center; background: linear-gradient(120deg, #120F1C, #050408 70%)">
<div style="max-width: 560px">
<div style="font-family: Michroma, IBM Plex Sans Arabic, sans-serif; font-size: clamp(20px, 2.4vw, 24px); line-height: 1.3; margin-bottom: 10px">{{t.missH}}</div>
<p style="color: #C9C3D6; margin: 0; line-height: 1.6">{{t.missP}}</p>
</div>
<a href="print.html" class="dm-btn dm-fill" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; background: #F2F0F7; color: #000; font-weight: 500; border-radius: 26px; text-decoration: none"><span class="dm-roll"><span data-t="{{t.missCta}}">{{t.missCta}}</span></span></a>
</div>
</section>

<sc-if value="{{qvOpen}}" hint-placeholder-val="{{ false }}">
<div class="dm-overlay" style="position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box">
<button type="button" onClick="{{closeQv}}" aria-label="Close quick view" style="position: absolute; inset: 0; border: 0; background: rgba(0,0,0,0.78); backdrop-filter: blur(6px); cursor: pointer"></button>
<div role="dialog" aria-modal="true" aria-label="{{qv.name}}" class="dm-pop" style="position: relative; width: 100%; max-width: 940px; max-height: 100%; overflow-y: auto; background: #0A0910; border: 1px solid #2E2A38; border-radius: 20px; box-shadow: 0 40px 120px rgba(107,79,216,0.35); display: flex; flex-wrap: wrap">
<div style="flex: 1 1 360px; min-width: 0; padding: 14px; box-sizing: border-box">
<div style="aspect-ratio: 4 / 5; border-radius: 12px; overflow: hidden; background: #08070C"><img src="{{qv.shown}}" alt="{{qv.name}}" style="width: 100%; height: 100%; object-fit: cover"></div>
<div style="display: flex; gap: 10px; margin-top: 10px">
<sc-for list="{{qv.thumbs}}" as="th" hint-placeholder-count="2"><button type="button" onClick="{{th.pick}}" aria-label="Photo {{th.n}}" aria-pressed="{{th.on}}" style="{{th.style}}"><img src="{{th.src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; border-radius: 6px"></button></sc-for>
</div>
</div>
<div style="flex: 1 1 320px; min-width: 0; padding: 28px clamp(20px, 3vw, 36px) 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; gap: 12px; align-items: flex-start">
<span style="color: #B9A6FF; font-size: 14px">{{qv.col}}</span>
<button type="button" class="dm-ico" onClick="{{closeQv}}" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
</div>
<h2 style="font-family: Michroma, IBM Plex Sans Arabic, sans-serif; font-weight: 400; font-size: clamp(22px, 2.6vw, 30px); line-height: 1.25; margin: 0">{{qv.name}}</h2>
<sc-if value="{{qv.ar}}" hint-placeholder-val="{{ false }}"><div lang="ar" style="font-size: 20px; color: #C9C3D6">{{qv.ar}}</div></sc-if>
<div style="font-size: 22px" dir="ltr">QAR {{qv.price}}</div>
<ul style="margin: 4px 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; color: #C9C3D6; font-size: 15px">
<li>{{t.f1}}</li><li>{{t.f2}}</li><li>{{t.f3}}</li>
</ul>
<div style="display: flex; align-items: center; gap: 12px; margin-top: 8px">
<span>{{t.qty}}</span>
<button type="button" class="dm-ico" onClick="{{qvDown}}" aria-label="Fewer" style="border: 1px solid #3A3546; font-size: 20px">−</button>
<strong aria-live="polite" style="min-width: 24px; text-align: center; font-weight: 500; font-size: 18px">{{qv.qty}}</strong>
<button type="button" class="dm-ico" onClick="{{qvUp}}" aria-label="More" style="border: 1px solid #3A3546; font-size: 20px">+</button>
</div>
<button type="button" class="dm-btn dm-fill" onClick="{{qvAdd}}" style="margin-top: 8px; min-height: 54px; border: 0; border-radius: 27px; background: #F2F0F7; color: #000; font-weight: 500; cursor: pointer"><span class="dm-roll"><span data-t="{{qv.addLabel}}">{{qv.addLabel}}</span></span></button>
<a href="https://wa.me/97460085588" target="_blank" rel="noopener" class="dm-btn dm-line" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; border: 1px solid #3A3546; border-radius: 25px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/></svg><span class="dm-roll"><span data-t="{{t.askWa}}">{{t.askWa}}</span></span></a>
</div>
</div>
</div>
