<style>
body{margin:0;background:#000}
a{color:#F2F0F7}a:hover{color:#C8B8FF}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #8B6CFF;outline-offset:3px}
input,textarea,select,button{font:inherit}
@property --dm-a{syntax:'<angle>';initial-value:0deg;inherits:false}
.dm-btn{position:relative;isolation:isolate;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease,background-color .3s ease,color .3s ease}
.dm-btn::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--dm-a),transparent 0deg,transparent 220deg,rgba(139,108,255,.9) 290deg,#E9E2FF 330deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s ease;pointer-events:none;z-index:1}
.dm-btn:hover::before,.dm-btn:focus-visible::before{opacity:1;animation:dmOrbitLine 1.8s linear infinite}
@keyframes dmOrbitLine{to{--dm-a:360deg}}
.dm-btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px -14px rgba(139,108,255,.85),0 0 0 1px rgba(139,108,255,.25)}
.dm-btn:active{transform:translateY(0) scale(.98)}
.dm-fill:hover{background-color:#FFFFFF !important;color:#000 !important}
.dm-line:hover{background-color:rgba(139,108,255,.14) !important}
.dm-roll{display:inline-block;position:relative;overflow:hidden;vertical-align:middle;line-height:1.3}
.dm-roll>span{display:inline-block;position:relative;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.dm-roll>span::after{content:attr(data-t);position:absolute;left:0;top:100%;white-space:nowrap}
.dm-btn:hover .dm-roll>span,.dm-btn:focus-visible .dm-roll>span{transform:translateY(-100%)}
.dm-ico{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:#F2F0F7;cursor:pointer;transition:background-color .25s ease,box-shadow .25s ease,color .25s ease}
.dm-ico:hover{background-color:#16131D;box-shadow:0 0 22px rgba(139,108,255,.45);color:#C8B8FF}
.dm-nav a{background:linear-gradient(#C8B8FF,#C8B8FF) 0 100%/0 1px no-repeat;transition:background-size .35s cubic-bezier(.2,.8,.2,1),color .25s ease}
.dm-nav a:hover{background-size:100% 1px}
.dm-dash{transition:border-color .25s ease,color .25s ease,box-shadow .25s ease}
.dm-dash:hover{border-color:#8B6CFF;color:#F2F0F7;box-shadow:0 0 20px rgba(139,108,255,.35)}
.dm-mob{display:none !important}
.dm-menu{animation:dmMenuFade .35s ease both}
@keyframes dmMenuFade{from{opacity:0}to{opacity:1}}
.dm-mi{opacity:0;animation:dmMenuIn .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes dmMenuIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (max-width: 820px){.dm-desk{display:none !important}.dm-mob{display:inline-flex !important}}
@media (prefers-reduced-motion: reduce){.dm-btn,.dm-roll>span{transition:none}.dm-btn:hover::before{animation:none}.dm-menu,.dm-mi{animation:none;opacity:1}}
.dm-3d,.dm-3d *{transform-style:preserve-3d}
.dm-face{position:absolute;backface-visibility:hidden;transition:background-color .6s ease,border-color .6s ease,box-shadow .6s ease}
.dm-spin{animation:dmSpin 20s linear infinite}
@keyframes dmSpin{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
.dm-bar{transition:width 2.6s linear}
@media (prefers-reduced-motion: reduce){.dm-spin{animation:none}.dm-bar{transition:none}}
.dm-rise{opacity:0;animation:dmRise 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes dmRise{from{opacity:0;transform:translateY(30px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.dm-fade{opacity:0;animation:dmFade 1.4s ease .3s forwards}
@keyframes dmFade{to{opacity:1}}
.dm-mech-scale{transform:scale(1.05)}
.dm-grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.dm-kb1{animation:dmKb1 14s ease-in-out infinite}
.dm-kb2{animation:dmKb2 14s ease-in-out infinite}
@keyframes dmKb1{0%{opacity:1;transform:scale(1)}45%{opacity:1;transform:scale(1.08)}55%{opacity:0;transform:scale(1.1)}95%{opacity:0;transform:scale(1)}100%{opacity:1;transform:scale(1)}}
@keyframes dmKb2{0%{opacity:0;transform:scale(1.08)}45%{opacity:0;transform:scale(1.08)}55%{opacity:1;transform:scale(1.04)}95%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.dm-card{transition:border-color .3s ease,box-shadow .3s ease,transform .4s cubic-bezier(.2,.8,.2,1)}
.dm-card:hover{border-color:#8B6CFF;box-shadow:0 0 0 1px #8B6CFF,0 0 48px rgba(139,108,255,.3);transform:translateY(-4px)}
.dm-img{transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.dm-img2{opacity:0;transition:opacity .5s ease,transform .7s cubic-bezier(.2,.8,.2,1);transform:scale(1.04)}
.dm-card:hover .dm-img2{opacity:1;transform:scale(1)}
.dm-range{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:#2E2A38}
.dm-range::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:12px;background:#F2F0F7;box-shadow:0 0 18px rgba(139,108,255,.8);cursor:grab}
.dm-range::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:11px;background:#F2F0F7;box-shadow:0 0 18px rgba(139,108,255,.8);cursor:grab}
@media (max-width: 1024px){.dm-grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width: 820px){.dm-hero-copy{padding:16px 0 0 !important}}
@media (max-width: 640px){.dm-mech-area{height:440px !important}.dm-mech-scale{transform:scale(.8)}}
@media (max-width: 420px){.dm-grid4{gap:12px !important}}
@media (prefers-reduced-motion: reduce){.dm-rise,.dm-fade{animation:none;opacity:1}.dm-kb1{animation:none}.dm-kb2{animation:none;opacity:0}}

</style>

</head>

<script>

t: { loop: ar ? 'تابعونا' : 'Get in the loop', dash: ar ? 'لوحة الفريق' : 'Team dashboard' }
};

shade(hex, k) {
const n = parseInt(hex.slice(1), 16);
const f = (v) => Math.max(0, Math.min(255, Math.round(v * k)));
return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}
parts() {
const P = [], add = (w, h, d, x, y, z, r) => P.push([w, h, d, x, y, z, r]);
add(210, 22, 210, 0, 184, 0, 'plinth'); add(176, 6, 176, 0, 170, 0, 'trim');
[-1, 1].forEach((s) => {
add(48, 18, 66, s * 30, 158, 8, 'armor'); add(38, 72, 42, s * 30, 113, 0, 'armor'); add(30, 18, 30, s * 30, 70, 0, 'joint');
add(34, 50, 36, s * 28, 38, 0, 'dark'); add(48, 42, 54, s * 82, -64, 0, 'accent'); add(24, 44, 26, s * 84, -24, 0, 'joint');
add(34, 56, 36, s * 86, 24, 0, 'armor'); add(26, 22, 28, s * 86, 62, 0, 'dark');
});
add(96, 28, 52, 0, 4, 0, 'armor'); add(56, 22, 38, 0, -18, 0, 'dark'); add(112, 58, 62, 0, -56, 0, 'armor');
add(54, 16, 8, 0, -58, 33, 'accent'); add(74, 62, 30, 0, -54, -46, 'dark'); add(22, 12, 22, 0, -92, 0, 'joint');
add(46, 38, 44, 0, -116, 0, 'armor'); add(34, 7, 4, 0, -117, 23, 'visor'); add(5, 36, 5, 15, -150, -4, 'dark'); add(12, 6, 12, 15, -170, -4, 'accent');

}
faces(stage) {
const out = [];
const lines = 'background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 4px);';
this.parts().forEach((p) => {
const [w, h, d, x, y, z, role] = p;
const fixed = role === 'plinth' || role === 'trim';
let base;
if (role === 'plinth') base = '#15121C'; else if (role === 'trim') base = '#6B4FD8';
else if (stage === 1) base = '#8F8A9C';
else if (role === 'visor') base = '#B9A6FF';
else base = { armor: '#E6E3EC', dark: '#2B2735', joint: '#4A4458', accent: '#7A5CF0' }[role];
const T = 'translate3d(' + x + 'px,' + y + 'px,' + z + 'px) ';
[[w, h, '', d / 2, 1], [w, h, 'rotateY(180deg) ', d / 2, 0.55], [d, h, 'rotateY(90deg) ', w / 2, 0.8], [d, h, 'rotateY(-90deg) ', w / 2, 0.7], [w, d, 'rotateX(90deg) ', h / 2, 1.15], [w, d, 'rotateX(-90deg) ', h / 2, 0.4]].forEach((f) => {
let look;
if (stage === 0 && !fixed) look = 'background-color: rgba(139,108,255,0.06); border: 1px solid rgba(185,166,255,0.75); box-sizing: border-box; box-shadow: inset 0 0 10px rgba(139,108,255,0.25);';
else look = 'background-color: ' + this.shade(base, f[4]) + ';' + (stage === 1 && !fixed ? lines : '') + (stage === 2 && role === 'visor' ? 'box-shadow: 0 0 18px 4px rgba(185,166,255,0.9);' : '');
out.push({ style: 'width: ' + f[0] + 'px; height: ' + f[1] + 'px; left: ' + (-f[0] / 2) + 'px; top: ' + (-f[1] / 2) + 'px; ' + look + 'transform: ' + T + f[2] + 'translateZ(' + f[3] + 'px)' });
});
});
return out;
}
pill(on) {
return 'min-height: 44px; padding: 0 18px; border-radius: 22px; font-size: 15px; cursor: pointer; ' + (on ? 'background: #F2F0F7; color: #000; border: 1px solid #F2F0F7' : 'background: transparent; color: #F2F0F7; border: 1px solid #3A3546');
}
renderVals() {
const s = this.state, ar = !!s.ar;
const T = ar ? {
h1: 'قطع تروي قصصًا يمكنك الإمساك بها.', sub: 'مقتنيات محدودة، تُطبع واحدة تلو الأخرى وتُشطّب يدويًا في قطر. أو أرسل لنا تصميمك وسنحوّله إلى حقيقة.',
cta1: 'استكشف المجموعة', cta2: 'اطبع تصميمك', feat: 'مجموعة مختارة', viewAll: 'عرض الكل', sigLabel: 'القطعة المميزة',
sigText: 'تحية لغواصي اللؤلؤ في قطر، في اللحظة بين المخاطرة والمكافأة. راتنج، 30 × 20 سم، تُصنع حسب الطلب خلال 10 إلى 15 يومًا.', sigCta: 'اكتشف القطعة',
p1: 'فريدة', p1t: 'تصاميم وتفاصيل أصلية لن تجدها في أي مكان آخر.', p2: 'بدون إنتاج بالجملة', p2t: 'كل قطعة تُطبع منفردة وبكميات محدودة.', p3: 'تحضير وطلاء يدوي', p3t: 'تُصنفر وتُطلى يدويًا في الاستوديو في الدوحة.',
labLabel: 'خدمات الطباعة ثلاثية الأبعاد', labH: 'لديك فكرة؟ اعرف تكلفتها.', labP: 'اختر الحجم والتشطيب لسعر تقريبي. نؤكد السعر النهائي بعد مراجعة ملفك.',
height: 'الارتفاع', material: 'المادة', finish: 'التشطيب', qty: 'الكمية', estimate: 'السعر التقريبي', ready: 'جاهزة خلال', days: 'يوم', ptime: 'وقت الطباعة',
labCta: 'أرسل تصميمي لسعر دقيق', labNote: 'أسعار تجريبية لهذا النموذج. داركماتر تحدد الأسعار الفعلية.'
} : {
h1: 'Pieces that tell stories you can hold.', sub: 'Limited collectibles, 3D printed one at a time and finished by hand in Qatar. Or send us your own design and we will bring it to life.',
cta1: 'Explore the collection', cta2: 'Print your design', feat: 'Featured collection', viewAll: 'View all 51', sigLabel: 'Signature piece',
sigText: 'A tribute to Qatar\'s pearl divers, caught in the moment between risk and reward. Resin, 30 × 20 cm, made to order in 10 to 15 days.', sigCta: 'Explore the piece',
p1: 'Unique', p1t: 'Original designs and details you will not find on a shelf anywhere else.', p2: 'No mass production', p2t: 'Each piece is printed on its own, in limited runs.', p3: 'Prepared and painted by hand', p3t: 'Sanded, primed and painted in our Doha studio.',
labLabel: '3D printing services', labH: 'Got an idea? See what it could cost.', labP: 'Set the size and finish for a rough price. We confirm the exact quote once we see your file or sketch.',
height: 'Height', material: 'Material', finish: 'Finish', qty: 'Quantity', estimate: 'Estimated price', ready: 'Ready in', days: 'days', ptime: 'Print time',
labCta: 'Send my design for an exact quote', labNote: 'Sample rates for this mockup. DarkMatter sets the real pricing.'
};
const sdefs = ar ? [['نحت رقمي', 'نحت رقمي'], ['طباعة', 'طباعة خام من الطابعة'], ['طلاء', 'طلاء يدوي']] : [['Sculpted', 'Digital sculpt'], ['Printed', 'Raw print, straight off the printer'], ['Painted', 'Hand-painted finish']];
const stages = sdefs.map((d, i) => ({ label: d[0], current: s.stage === i ? 'step' : 'false',
pick: () => { this.setState({ stage: i }); this.start(); },
style: 'width: 100%; padding: 0; background: transparent; border: 0; font-size: 14px; text-align: start; cursor: pointer; min-height: 44px; transition: color .3s; color: ' + (s.stage === i ? '#F2F0F7' : '#6E6880'),
bar: 'display: block; height: 100%; background: #8B6CFF; box-shadow: 0 0 10px rgba(139,108,255,0.8); width: ' + (s.stage === i ? '100%' : '0%') + (s.stage === i ? '' : '; transition: none') }));
const matRate = { 'PLA': 0.8, 'PETG': 1.0, 'Resin': 1.6 }[s.mat];
const finRate = { 'Raw print': 1, 'Primed': 1.25, 'Painted': 2.2 }[s.fin];
const total = (40 + Math.pow(s.h, 1.5) * 2.2 * matRate) * finRate * s.q * (s.q > 1 ? 0.9 : 1);
const r10 = (v) => Math.max(10, Math.round(v / 10) * 10).toLocaleString('en-US');
const days = Math.round(3 + s.h / 6 + (s.fin === 'Painted' ? 5 : s.fin === 'Primed' ? 2 : 0) + (s.q - 1) * 1.5);
const est = { h: s.h, q: s.q, low: r10(total * 0.85), high: r10(total * 1.15), days: days + '–' + (days + 3),
hours: Math.round(s.h * s.h * (s.mat === 'Resin' ? 0.05 : 0.08) * s.q + 2),
bar: 'height: 100%; border-radius: 3px; background: linear-gradient(90deg, #6B4FD8, #C8B8FF); box-shadow: 0 0 14px rgba(139,108,255,0.8); transition: width .4s cubic-bezier(.2,.8,.2,1); width: ' + Math.min(100, Math.max(4, total / 60)).toFixed(1) + '%' };
const finLabels = ar ? { 'Raw print': 'طباعة خام', 'Primed': 'أساس', 'Painted': 'مطلية' } : { 'Raw print': 'Raw print', 'Primed': 'Primed', 'Painted': 'Painted' };
const matTabs = ['PLA', 'PETG', 'Resin'].map((label) => ({ label: ar && label === 'Resin' ? 'راتنج' : label, checked: String(s.mat === label), pick: () => this.setState({ mat: label }), style: this.pill(s.mat === label) }));
const estFinTabs = ['Raw print', 'Primed', 'Painted'].map((label) => ({ label: finLabels[label], checked: String(s.fin === label), pick: () => this.setState({ fin: label }), style: this.pill(s.fin === label) }));
return Object.assign(this.hdr('home', 0), {
t: Object.assign({ loop: ar ? 'تابعونا' : 'Get in the loop', dash: ar ? 'لوحة الفريق' : 'Team dashboard' }, T),
faces: this.faces(s.stage), stages, mechCaption: sdefs[s.stage][1], mechLabel: 'Original DarkMatter figure: ' + sdefs[s.stage][1],
est, matTabs, estFinTabs,
setH: (e) => this.setState({ h: Number(e.target.value) }),
qtyUp: () => this.setState({ q: Math.min(50, s.q + 1) }),
qtyDown: () => this.setState({ q: Math.max(1, s.q - 1) })
});
}
