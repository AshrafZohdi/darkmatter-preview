<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Track your request | DarkMatter</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#F2F0F7}a:hover{color:#C8B8FF}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #8B6CFF;outline-offset:3px}
input,textarea,select,button{font:inherit}
@property --dm-a{syntax:'<angle>';initial-value:0deg;inherits:false}
.dm-btn{position:relative;isolation:isolate;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease,background-color .3s ease,color .3s ease}
.dm-btn::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--dm-a),transparent 0deg,transparent 220deg,rgba(139,108,255,.9) 290deg,#E9E2FF 330deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s ease;pointer-events:none;z-index:1}
.dm-btn:hover::before,.dm-btn:focus-visible::before{opacity:1;animation:dmOrbitLine 1.8s linear infinite}
@keyframes dmOrbitLine{to{--dm-a:360deg}}
.dm-btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px -14px rgba(139,108,255,.85),0 0 0 1px rgba(139,108,255,.25)}
.dm-btn:active{transform:translateY(0) scale(.98)}
.dm-fill:hover{background-color:#FFFFFF !important;color:#000 !important}
.dm-line:hover{background-color:rgba(139,108,255,.14) !important}
.dm-roll{display:inline-block;position:relative;overflow:hidden;vertical-align:middle;line-height:1.3}
.dm-roll>span{display:inline-block;position:relative;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.dm-roll>span::after{content:attr(data-t);position:absolute;left:0;top:100%;white-space:nowrap}
.dm-btn:hover .dm-roll>span,.dm-btn:focus-visible .dm-roll>span{transform:translateY(-100%)}
.dm-ico{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:#F2F0F7;cursor:pointer;transition:background-color .25s ease,box-shadow .25s ease,color .25s ease}
.dm-ico:hover{background-color:#16131D;box-shadow:0 0 22px rgba(139,108,255,.45);color:#C8B8FF}
.dm-nav a{background:linear-gradient(#C8B8FF,#C8B8FF) 0 100%/0 1px no-repeat;transition:background-size .35s cubic-bezier(.2,.8,.2,1),color .25s ease}
.dm-nav a:hover{background-size:100% 1px}
.dm-dash{transition:border-color .25s ease,color .25s ease,box-shadow .25s ease}
.dm-dash:hover{border-color:#8B6CFF;color:#F2F0F7;box-shadow:0 0 20px rgba(139,108,255,.35)}
.dm-mob{display:none !important}
.dm-menu{animation:dmMenuFade .35s ease both}
@keyframes dmMenuFade{from{opacity:0}to{opacity:1}}
.dm-mi{opacity:0;animation:dmMenuIn .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes dmMenuIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (max-width: 820px){.dm-desk{display:none !important}.dm-mob{display:inline-flex !important}}
@media (prefers-reduced-motion: reduce){.dm-btn,.dm-roll>span{transition:none}.dm-btn:hover::before{animation:none}.dm-menu,.dm-mi{animation:none;opacity:1}}
.dm-pop{animation:dmPop .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes dmPop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.dm-pulse{animation:dmPulse 1.6s ease-in-out infinite}
@keyframes dmPulse{0%,100%{box-shadow:0 0 0 0 rgba(139,108,255,.6)}50%{box-shadow:0 0 0 8px rgba(139,108,255,0)}}

</style>
<style>body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="dm-template">
<div dir="{{dir}}" lang="{{lang}}" style="width: 390px; min-height: 1000px; box-sizing: border-box; background: #000000; color: #F2F0F7; font-family: 'IBM Plex Sans Arabic', sans-serif; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 24px; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; right: -160px; top: 120px; width: 420px; height: 420px; background: radial-gradient(closest-side, rgba(107,79,216,0.3), transparent); pointer-events: none"></div>
<div style="position: relative; display: flex; justify-content: space-between; align-items: center">
<a href="index.html" style="font-family: Michroma, IBM Plex Sans Arabic, sans-serif; font-size: 14px; letter-spacing: 0.12em; line-height: 1.05; text-decoration: none" dir="ltr">DARK<br>MATTER</a>
<button type="button" class="dm-ico" onClick="{{toggleLang}}" style="width: auto; padding: 0 12px; font-size: 15px">{{langLabel}}</button>
</div>
<div style="position: relative">
<div style="color: #A9A3B8; font-size: 14px; margin-bottom: 6px">{{t.yours}}</div>
<h1 style="font-family: Michroma, IBM Plex Sans Arabic, sans-serif; font-weight: 400; font-size: 32px; margin: 0 0 6px" dir="ltr">DM-1042</h1>
<div style="color: #C9C3D6">{{t.what}}</div>
</div>

<sc-if value="{{notPaid}}" hint-placeholder-val="{{ true }}">
<div class="dm-pop" style="position: relative; background: #0F0C18; border: 1px solid #2E2A38; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><strong style="font-size: 17px; font-weight: 500">{{t.quote}}</strong><span style="font-family: Michroma, IBM Plex Sans Arabic, sans-serif; font-size: 20px" dir="ltr">QAR 850</span></div>
<div style="color: #A9A3B8; font-size: 14px; line-height: 1.5">{{t.quoteP}}</div>
<div role="radiogroup" aria-label="Payment method" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{methods}}" as="m" hint-placeholder-count="4"><button type="button" role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button></sc-for>
</div>
<button type="button" class="dm-btn dm-fill" onClick="{{pay}}" style="min-height: 54px; background: #F2F0F7; color: #000; font-weight: 500; border: 0; border-radius: 27px; cursor: pointer"><span class="dm-roll"><span data-t="{{payLabel}}">{{payLabel}}</span></span></button>
<button type="button" onClick="{{toggleDecline}}" style="background: none; border: 0; color: #A9A3B8; text-decoration: underline; cursor: pointer; min-height: 44px; font-size: 14px">{{t.change}}</button>
<sc-if value="{{declineOpen}}" hint-placeholder-val="{{ false }}"><a href="https://wa.me/97460085588" target="_blank" rel="noopener" class="dm-btn dm-line" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border: 1px solid #3A3546; border-radius: 24px; text-decoration: none; font-size: 15px"><span class="dm-roll"><span data-t="{{t.discuss}}">{{t.discuss}}</span></span></a></sc-if>
</div>
</sc-if>
<sc-if value="{{paid}}" hint-placeholder-val="{{ false }}">
<div class="dm-pop" role="status" style="position: relative; background: #0F0C18; border: 1px solid #3A2F66; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 20px 60px rgba(107,79,216,0.3)">
<strong style="font-size: 17px; font-weight: 500">{{t.paidH}}</strong>
<span style="color: #C9C3D6; font-size: 14px; line-height: 1.5">{{paidText}}</span>
<button type="button" onClick="{{undo}}" style="align-self: flex-start; background: none; border: 0; color: #A9A3B8; text-decoration: underline; cursor: pointer; min-height: 44px; padding: 0; font-size: 13px">{{t.reset}}</button>
</div>
</sc-if>

<section aria-label="Progress" style="position: relative">
<ol style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="6">
<li style="display: flex; gap: 14px">
<div style="display: flex; flex-direction: column; align-items: center; width: 18px"><span style="{{s.dot}}"></span><span style="{{s.line}}"></span></div>
<div style="padding-bottom: 18px"><div style="{{s.labelStyle}}">{{s.label}}</div><div style="color: #A9A3B8; font-size: 13px">{{s.note}}</div></div>
</li>
</sc-for>
</ol>
</section>

<a href="https://wa.me/97460085588" target="_blank" rel="noopener" class="dm-btn dm-line" style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; border: 1px solid #4A4458; border-radius: 25px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/></svg><span class="dm-roll"><span data-t="{{t.questions}}">{{t.questions}}</span></span></a>
</div>
</script>
<script src="assets/preact.min.umd.js"></script>
<script src="assets/runtime.js?v=10c3774c60968"></script>
<script>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { paid: false, method: 'Card', decline: false, ar: false }; }
renderVals() {
const s = this.state, ar = !!s.ar;
const T = ar ? { yours: 'طلبك', what: 'صقر · راتنج · مطلي · 25 سم', quote: 'عرض السعر', quoteP: 'جاهز في 10 ديسمبر. ادفع عربونًا 50% (425 ريال) لبدء الطباعة. الباقي عند الاستلام.', change: 'تريد تعديل شيء؟', discuss: 'ناقش العرض عبر واتساب', paidH: 'تم دفع العربون', reset: 'إعادة العرض التجريبي', questions: 'أسئلة؟ تحدث معنا عبر واتساب' }
: { yours: 'Your request', what: 'Falcon statue · resin · painted · 25 cm', quote: 'Your quote', quoteP: 'Ready by 10 Dec. Pay a 50% deposit (QAR 425) to start printing. The rest is due on pickup or delivery.', change: 'Want to change something?', discuss: 'Discuss the quote on WhatsApp', paidH: 'Deposit paid', reset: 'Reset demo', questions: 'Questions? Chat on WhatsApp' };
const list = ar ? [['تم استلام الطلب', '15 أكتوبر، 12:20'], ['تم إرسال العرض', '15 أكتوبر، 16:05'], ['دفع العربون', s.paid ? 'الآن' : 'بانتظارك'], ['الطباعة', s.paid ? 'تبدأ غدًا' : ''], ['الطلاء والتشطيب', ''], ['جاهز للاستلام أو التوصيل', 'متوقع 10 ديسمبر']]
: [['Request received', '15 Oct, 12:20'], ['Quote sent', '15 Oct, 16:05'], ['Deposit paid', s.paid ? 'Just now' : 'Waiting for you'], ['Printing', s.paid ? 'Starts tomorrow' : ''], ['Painting and finishing', ''], ['Ready for pickup or delivery', 'Est. 10 Dec']];
const nowIdx = s.paid ? 3 : 2;
const stages = list.map((d, i) => {
const st = i < nowIdx ? 'done' : i === nowIdx ? 'now' : 'todo';
return { label: d[0], note: d[1],
dot: 'width: 14px; height: 14px; border-radius: 7px; box-sizing: border-box; flex: none; transition: all .4s ease; ' + (st === 'done' ? 'background: #8B6CFF' : st === 'now' ? 'border: 3px solid #8B6CFF; background: #000; animation: dmPulse 1.6s ease-in-out infinite' : 'border: 1.5px solid #4A4458'),
line: i === list.length - 1 ? 'display: none' : 'flex: 1; width: 2px; min-height: 22px; transition: background .4s ease; background: ' + (st === 'done' ? '#8B6CFF' : '#2E2A38'),
labelStyle: 'font-size: 15px; line-height: 14px; margin-bottom: 6px; ' + (st === 'todo' ? 'color: #8A8499' : 'color: #F2F0F7; font-weight: 500') };
});
const methods = ['Card', 'NAPS', 'STC Pay', 'Apple Pay'].map((m) => ({ label: m, on: String(s.method === m), pick: () => this.setState({ method: m }),
style: 'min-height: 44px; border-radius: 12px; font-size: 14px; cursor: pointer; transition: all .25s ease; ' + (s.method === m ? 'background: rgba(139,108,255,0.16); color: #F2F0F7; border: 1px solid #8B6CFF' : 'background: transparent; color: #C9C3D6; border: 1px solid #2E2A38') }));
return {
t: T, stages, methods, paid: s.paid, notPaid: !s.paid, declineOpen: s.decline,
payLabel: (ar ? 'ادفع 425 ريال عبر ' : 'Pay QAR 425 with ') + s.method,
paidText: (ar ? 'تم استلام 425 ريال عبر ' + s.method + '. أرسلنا الإيصال عبر واتساب، وتبدأ الطباعة غدًا.' : 'QAR 425 received via ' + s.method + '. Your receipt is on WhatsApp and printing starts tomorrow.'),
pay: () => this.setState({ paid: true }), undo: () => this.setState({ paid: false }), toggleDecline: () => this.setState({ decline: !s.decline }),
toggleLang: () => this.setState({ ar: !ar }), langLabel: ar ? 'English' : 'العربية', dir: ar ? 'rtl' : 'ltr', lang: ar ? 'ar' : 'en'
};
}
}
mountPage(Component);
</script>
</body>
</html>
